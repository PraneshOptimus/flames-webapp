<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flames</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('/images/valentine.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #ff6f61;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"] {
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }

        button {
            background-color: #ff6f61;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #e85a4f;
            transform: scale(1.05);
        }

        .result {
            margin-top: 20px;
            font-size: 1.3em;
            color: #4a4a4a;
        }

        @media screen and (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body th:style="'background-image: url(/images/' + ${bgImage} + ');'">
<div class="container">
    <h1><i class="fas fa-heart icon"></i> Flames</h1>
    <form action="/result" method="post" th:object="${flamesRequest}">
        <label for="name1">Your Name:</label>
        <input type="text" id="name1" th:field="*{name1}" required />

        <label for="name2">Partner's Name:</label>
        <input type="text" id="name2" th:field="*{name2}" required />

        <button type="submit"><i class="fas fa-search-heart icon"></i>Check</button>
    </form>

    <div class="result" th:if="${result}">
        <p><strong><i class="fas fa-star icon"></i> Result:</strong> <span th:text="${result}"></span></p>
    </div>
</div>
</body>
</html>
